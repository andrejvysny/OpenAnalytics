# OpenAnalytics — development stack.
#
# Hot reload via Bun --watch and Next dev. Source is bind-mounted from the host.
# Run from repo root:
#   docker compose up        # foreground, logs visible
#   docker compose up -d     # background
#   docker compose down -v   # tear down + drop DB
#
# Web on http://localhost:3000, API on http://localhost:3001.
# Bootstrap a dev user once postgres is healthy:
#   docker compose exec api bun apps/api/scripts/dev-bootstrap.ts

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oa
      POSTGRES_USER: oa
      POSTGRES_PASSWORD: oa
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oa']
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: oven/bun:1.3-alpine
    working_dir: /app
    command: >
      sh -c "apk add --no-cache nodejs npm netcat-openbsd >/dev/null
      && npm i -g pnpm@10 >/dev/null
      && pnpm install --filter @oa/api... --frozen-lockfile=false
      && /app/docker/api-entrypoint.sh bun --watch apps/api/src/index.ts"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgres://oa:oa@postgres:5432/oa
      SESSION_SECRET: dev-secret-dev-secret-dev-secret-dev-secret
      PUBLIC_WEB_URL: http://localhost:3000
      PUBLIC_API_URL: http://localhost:3001
    ports:
      - '3001:3001'
    volumes:
      - ./:/app
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app/apps/web
    command: >
      sh -c "apk add --no-cache >/dev/null
      && npm i -g pnpm@10 >/dev/null
      && cd /app && pnpm install --filter @oa/web... --frozen-lockfile=false
      && cd /app/apps/web && pnpm exec next dev -p 3000 -H 0.0.0.0"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001
      INTERNAL_API_URL: http://api:3001
    ports:
      - '3000:3000'
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/apps/web/.next
    depends_on:
      - api

volumes:
  pgdata:
  api_node_modules:
  web_node_modules:
  web_next_cache:
