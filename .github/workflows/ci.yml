name: ci
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oa
          POSTGRES_USER: oa
          POSTGRES_PASSWORD: oa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U oa" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm -r typecheck
      - run: pnpm --filter @oa/parser test
      # CLI has Bun tests but no package `test` script — run them directly.
      - run: pnpm --filter @oa/cli exec bun test
      # Catch broken journaled migrations against a real Postgres before release.
      - run: pnpm --filter @oa/db migrate
        env:
          DATABASE_URL: postgres://oa:oa@localhost:5432/oa
      # API tests need a real Postgres. The harness (apps/api/src/test/setup.ts, loaded
      # via bunfig preload) creates `oa_test` on the same server, migrates it, and
      # repoints DATABASE_URL at it — the `oa` database above is never touched.
      - run: pnpm --filter @oa/api test
        env:
          DATABASE_URL: postgres://oa:oa@localhost:5432/oa
      # NOTE: `next lint` (web) is not configured (no ESLint flat config). Add an
      # eslint.config.mjs + eslint-config-next, then re-enable `pnpm -r lint` here.
