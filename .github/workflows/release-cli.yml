name: release-cli
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        target:
          - { triple: bun-darwin-arm64, out: oa-darwin-arm64 }
          - { triple: bun-darwin-x64, out: oa-darwin-x64 }
          - { triple: bun-linux-arm64, out: oa-linux-arm64 }
          - { triple: bun-linux-x64, out: oa-linux-x64 }
          - { triple: bun-windows-x64, out: oa-windows-x64.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - name: Compile
        working-directory: apps/cli
        run: |
          bun build src/index.ts --compile --target=${{ matrix.target.triple }} --outfile=${{ matrix.target.out }}
          ls -la ${{ matrix.target.out }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.out }}
          path: apps/cli/${{ matrix.target.out }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find dist -type f -exec mv {} release/ \;
          ls -la release
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: release/*
          generate_release_notes: true
