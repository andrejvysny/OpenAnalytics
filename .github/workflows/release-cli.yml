name: release-cli

# Triggered on `v*` tags. Builds 5 platform binaries via `bun build --compile`
# and attaches them (plus SHA256SUMS) to a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.target.out }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { triple: bun-darwin-arm64, out: oa-darwin-arm64 }
          - { triple: bun-darwin-x64, out: oa-darwin-x64 }
          - { triple: bun-linux-arm64, out: oa-linux-arm64 }
          - { triple: bun-linux-x64, out: oa-linux-x64 }
          - { triple: bun-windows-x64, out: oa-windows-x64.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false

      - name: Compile ${{ matrix.target.out }}
        working-directory: apps/cli
        run: |
          bun build src/index.ts \
            --compile \
            --target=${{ matrix.target.triple }} \
            --outfile=${{ matrix.target.out }}
          ls -lh ${{ matrix.target.out }}

      - name: Smoke-test Linux x64 binary (others can't run on the runner)
        if: matrix.target.triple == 'bun-linux-x64'
        working-directory: apps/cli
        run: |
          ./${{ matrix.target.out }} --version
          ./${{ matrix.target.out }} --help | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.out }}
          path: apps/cli/${{ matrix.target.out }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: publish-release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten + checksum
        run: |
          set -e
          mkdir -p release
          find dist -type f -exec mv {} release/ \;
          cp scripts/install.sh release/install.sh
          chmod +x release/oa-darwin-* release/oa-linux-* 2>/dev/null || true
          chmod +x release/install.sh
          cd release
          ls -lh
          sha256sum oa-* > SHA256SUMS
          cat SHA256SUMS

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
